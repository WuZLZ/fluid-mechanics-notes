<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142d48"><title>流体力学 · 课堂速查</title><style>
:root{--navy:#142d48;--blue:#3177b7;--ink:#17304a;--muted:#70829a;--line:#e5ebf2;--bg:#f5f7fb}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}header{background:var(--navy);color:#fff;padding:24px max(22px,calc((100vw - 1080px)/2));position:relative;overflow:hidden}header:after{content:"";width:280px;height:280px;border:1px solid #ffffff15;border-radius:50%;position:absolute;right:-110px;top:-115px;pointer-events:none}.eyebrow{letter-spacing:.17em;color:#a9d2f0;font-size:12px;font-weight:700}h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.03em;margin:10px 0 4px}header p{color:#c8d9e9;font-size:13px;margin:0}.layout{max-width:1120px;margin:24px auto;display:grid;grid-template-columns:335px minmax(0,1fr);gap:23px;padding:0 18px}.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 7px 25px #1d3d5e08}.left{padding:19px;align-self:start;position:sticky;top:14px}.panel-head{display:flex;justify-content:space-between;align-items:center}.panel-head strong{font-size:18px}.count{font-size:12px;color:#61768a;background:#f1f5fa;padding:4px 10px;border-radius:20px}.search{margin:17px 0 19px;position:relative}.search input{border:1px solid #dbe5f0;background:#f6f9fd;border-radius:12px;width:100%;padding:14px 14px 14px 40px;outline:none;font-size:14px}.search input:focus{border-color:#528dcb;background:white;box-shadow:0 0 0 3px #dceafa}.search:before{content:"⌕";position:absolute;left:14px;top:3px;font-size:27px;color:#7892ad}.nav-hint{font-size:12px;color:var(--muted);margin-bottom:10px}.group{border:1px solid #e5ecf4;border-radius:12px;margin-bottom:11px;overflow:hidden}.group-head{display:flex;width:100%;align-items:center;justify-content:space-between;border:0;background:#f8fafd;color:#203955;padding:13px 14px;text-align:left;font-size:15px;font-weight:700}.group-head small{color:#7f92a8;font-size:12px}.group-head.active{background:#eaf2fc;color:#276299}.links{padding:6px 10px 10px}.links a{display:block;padding:9px 11px;color:#45617e;text-decoration:none;border-radius:8px;font-size:14px;line-height:1.4}.links a:hover,.links a:focus{background:#eef5fc;color:#18588d}.right .hero{padding:23px 25px 20px;margin-bottom:16px}.label{font-size:12px;letter-spacing:.06em;font-weight:800;color:#3a79b5}.hero h2{margin:7px 0 5px;font-size:24px}.hero p{font-size:13px;color:var(--muted);margin:0}.tools{display:flex;gap:9px;align-items:center;margin-top:14px;flex-wrap:wrap}.chip{border:0;background:#eaf2fa;color:#2c6caa;padding:6px 12px;border-radius:30px;font-size:12px;font-weight:700}.chip.selected{background:var(--navy);color:white}.sync{margin-left:auto;color:#8797a9;font-size:12px}.refresh{background:#fff;border:1px solid #d8e2ee;border-radius:8px;color:#426788;padding:5px 10px;font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 3px 12px}.section-title h3{font-size:18px;margin:0}.section-title span{font-size:12px;color:#8294a8}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px 21px;margin:0 0 12px;scroll-margin-top:20px;box-shadow:0 5px 14px #1d3d5e05}.card:target{border-color:#6ba1d1;box-shadow:0 0 0 3px #c8dff4}.card .num{font-size:11px;font-weight:800;color:#4286c1;letter-spacing:.06em}.card h4{margin:4px 0 12px;font-size:18px;line-height:1.45}.answer{font-size:15px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;color:#334b65;border-left:3px solid #4389c5;padding-left:13px}.meta{font-size:11px;color:#9aa8b7;margin-top:13px;border-top:1px solid #eef2f7;padding-top:10px}.empty{padding:30px;color:#7c8fa2;text-align:center}.hint{margin:9px 0 0;font-size:12px;color:#8a9cb0}@media(max-width:720px){header{padding:22px 19px}.layout{display:block;margin:13px auto;padding:0 11px}.left{position:static;margin-bottom:13px;padding:16px}.group-head{padding:13px 12px}.links{display:grid;grid-template-columns:1fr;max-height:none}.links a{padding:10px 9px;font-size:14px}.right .hero{padding:18px}.hero h2{font-size:21px}.card{padding:17px}.card h4{font-size:16px}.answer{font-size:14px}.sync{margin-left:0}}@media print{header{background:white;color:#000}.layout{display:block}.left,.tools,.refresh{display:none}.card{break-inside:avoid}}
</style></head><body><header><div class="eyebrow">FLUID MECHANICS / NOTEBOOK</div><h1>流体力学 · 课堂速查</h1><p>老师提问时，找到问题，直接看答案。不堆砌无关知识。</p></header><div class="layout"><aside class="panel left"><div class="panel-head"><strong>知识目录</strong><span id="total" class="count">加载中</span></div><div class="search"><input id="search" placeholder="搜索黏度、真空度、公式…" aria-label="搜索知识点"></div><div class="nav-hint">按章节归类 · 点击问题直达答案</div><nav id="nav"></nav><p class="hint">只收录明确讲过或需要的知识点</p></aside><main class="right"><div class="panel hero"><div class="label">QUICK REFERENCE</div><h2>上课速查，而不是知识仓库。</h2><p>每张卡片保留核心定义、必要公式和一句解释。长篇内容不会直接塞进来。</p><div class="tools"><button class="chip selected" data-chapter="all">全部</button><button class="chip" data-chapter="基础概念">基础概念</button><button class="chip" data-chapter="流体黏性">流体黏性</button><button class="chip" data-chapter="流体静力学">静力学</button><span class="sync" id="status"></span><button class="refresh" id="refresh">刷新</button></div></div><div id="content"></div></main></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),weeks=['周日','周一','周二','周三','周四','周五','周六'];let notes=[],chapter='all';const groups=['基础概念','流体黏性','流体静力学','流体运动的描述','欧拉法基本概念','连续性方程'];function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!==undefined)e.textContent=txt;return e}function date(s){const d=new Date(s+'T12:00:00');return isNaN(d)?s:(d.getMonth()+1)+'月'+d.getDate()+'日 '+weeks[d.getDay()]}function render(){const q=$('search').value.trim().toLowerCase(),hit=notes.filter(n=>(chapter==='all'||n.chapter===chapter)&&(n.title+' '+n.content+' '+(n.keywords||'')).toLowerCase().includes(q));$('total').textContent=hit.length+' 条';const nav=$('nav'),area=$('content');nav.replaceChildren();area.replaceChildren();let idx=0;for(const group of groups){const items=hit.filter(x=>x.chapter===group);if(!items.length)continue;const box=el('div','group'),btn=el('button','group-head'+(group===chapter?' active':''));btn.type='button';btn.append(el('span',null,group),el('small',null,items.length+' 条'));const list=el('div','links');for(const n of items){const a=el('a',null,n.title);a.href='#'+n.id;list.append(a)}btn.onclick=()=>{list.hidden=!list.hidden};box.append(btn,list);nav.append(box);const head=el('div','section-title');head.append(el('h3',null,group),el('span',null,items.length+' 个知识点'));area.append(head);for(const n of items){idx++;const card=el('article','card');card.id=n.id;card.append(el('div','num','QUESTION  '+String(idx).padStart(2,'0')),el('h4',null,n.title),el('div','answer',n.content),el('div','meta','新增 '+date(n.createdAt)+(n.updatedAt!==n.createdAt?' · 修改 '+date(n.updatedAt):'')));area.append(card)}}if(!hit.length)area.append(el('div','panel empty','没有找到相关知识点。'))}async function load(){const b=$('refresh');b.disabled=true;$('status').textContent='同步中';try{const r=await fetch('./notes.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.notes))throw Error('数据格式错误');notes=d.notes.filter(n=>typeof n.title==='string'&&typeof n.content==='string'&&typeof n.chapter==='string');render();$('status').textContent='已同步 '+notes.length+' 条'}catch(e){$('status').textContent='更新失败：'+e.message}finally{b.disabled=false}}document.querySelectorAll('[data-chapter]').forEach(b=>b.addEventListener('click',()=>{chapter=b.dataset.chapter;document.querySelectorAll('[data-chapter]').forEach(x=>x.classList.toggle('selected',x===b));render()}));$('search').oninput=()=>{chapter='all';document.querySelectorAll('[data-chapter]').forEach(x=>x.classList.toggle('selected',x.dataset.chapter==='all'));render()};$('refresh').onclick=load;load()})();
</script></body></html>
