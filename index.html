<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f5"><title>流体力学 · 课堂速查</title><style>
:root{--ink:#19343d;--muted:#788990;--line:#e6ebe8;--paper:#fff;--bg:#f7f8f5;--accent:#528b80}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:0 22px}.top{background:#fcfdfb;border-bottom:1px solid #e6ebe7}.top .shell{min-height:115px;padding-top:19px;padding-bottom:16px}.kicker{font-size:11px;letter-spacing:.16em;color:#65847e;font-weight:800}.titlebar{display:flex;justify-content:space-between;align-items:center;margin-top:6px}h1{font-size:30px;letter-spacing:-.045em;line-height:1.25;margin:0;font-weight:760}.top-meta{font-size:12px;color:#88979a}.subtitle{font-size:12px;color:#8a989a;margin:8px 0 0}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:34px;margin-top:27px}.left{position:sticky;top:18px;align-self:start}.search-wrap{position:relative}.search-wrap input{width:100%;padding:17px 18px 17px 47px;outline:none;background:white;border:1px solid #e2e9e5;border-radius:15px;box-shadow:0 5px 20px #244d4210}.search-wrap input:focus{border-color:#77a99f;box-shadow:0 0 0 3px #dbefeb}.search-icon{position:absolute;left:17px;top:7px;font-size:29px;color:#659288}.s-head{margin:30px 0 14px;display:flex;align-items:baseline;justify-content:space-between}.s-head h2{font-size:20px;margin:0}.s-head span{color:#899797;font-size:12px}.chapter{width:100%;border:1px solid #e8e9e5;border-radius:16px;background:#f0f2ed;margin:0 0 11px;overflow:hidden;text-align:left;transition:transform .15s,box-shadow .15s}.chapter:focus-within,.chapter:hover{box-shadow:0 6px 15px #274b4010}.chap-top{width:100%;padding:17px 19px 15px;border:0;background:transparent;text-align:left;color:var(--ink)}.chap-top .no{color:#5d897f;font-size:12px;font-weight:800;margin-right:8px}.chap-top .count{float:right;font-size:11px;color:#82918f}.chap-name{font-size:17px;font-weight:750;margin:5px 0 2px}.chap-sub{font-size:11px;color:#758786}.chapter:nth-child(3n+2){background:#eff1f4}.chapter:nth-child(3n+3){background:#f4f0ec}.chap-links{padding:2px 10px 12px;display:none}.chapter.open .chap-links{display:block}.chap-links a{display:block;padding:9px 12px;border-radius:9px;text-decoration:none;font-size:13px;line-height:1.45;color:#425a61}.chap-links a:hover,.chap-links a:focus{background:#ffffffb8}.detail-head{padding:2px 0 17px;display:flex;justify-content:space-between;align-items:end;gap:12px;border-bottom:1px solid var(--line);margin-bottom:18px}.detail-head h2{font-size:23px;letter-spacing:-.03em;margin:0}.detail-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.status{color:#91a1a2;font-size:12px}.refresh{background:white;border:1px solid var(--line);border-radius:9px;color:#567d78;padding:6px 12px;font-size:12px}.filter{display:flex;gap:7px;overflow:auto;scrollbar-width:none;margin-bottom:20px;padding-bottom:4px}.filter::-webkit-scrollbar{display:none}.pill{white-space:nowrap;border-radius:999px;border:1px solid #e0e8e3;background:#fff;color:#708382;padding:7px 14px;font-size:12px}.pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}.section-title{font-size:13px;font-weight:750;color:#6c8882;margin:28px 0 10px}.note{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px 22px;margin-bottom:12px;scroll-margin-top:20px}.note:target{border-color:#7db2a5;box-shadow:0 0 0 3px #d8eae4}.note .eyebrow{font-size:10px;letter-spacing:.14em;color:#92a4a0;font-weight:700}.note h3{font-size:18px;margin:6px 0 11px;line-height:1.45}.answer{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;color:#354e55;border-left:3px solid var(--accent);padding-left:13px;font-size:14px}.date{font-size:11px;color:#9aa9a8;margin-top:12px}.empty{background:white;border:1px solid var(--line);padding:30px;border-radius:15px;color:#7c9690}.foot{color:#9baaa5;font-size:11px;padding:18px 0 35px}.updates{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:8px}.mobile-nav{display:none}
@media(max-width:750px){.shell{padding:0 18px}.top .shell{min-height:107px;padding-top:16px}.titlebar h1{font-size:27px}.layout{display:block;margin-top:16px}.left{position:static}.s-head{margin:22px 0 12px}.chapter{margin-bottom:9px}.chap-top{padding:13px 17px}.chap-name{font-size:16px}.chap-sub{font-size:12px}.detail-head{margin-top:23px}.detail-head h2{font-size:21px}.note{padding:16px}.note h3{font-size:16px}.answer{font-size:14px}.filter{margin-bottom:13px}.chapter.open .chap-links{max-height:200px;overflow:auto}.top-meta{font-size:11px}}
@media print{.left,.filter,.refresh,.updates{display:none}.layout{display:block}.note{break-inside:avoid}}
</style></head><body><header class="top"><div class="shell"><div class="kicker">FM / NOTEBOOK</div><div class="titlebar"><h1>流体力学</h1><span class="top-meta" id="header-count">课堂速查</span></div><p class="subtitle">一条一个知识点，老师提问直接查。</p></div></header><div class="shell layout"><aside class="left"><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" placeholder="搜索定义、关键词、公式…" aria-label="搜索知识点"></div><div class="s-head"><h2>知识目录</h2><span>按章节快速定位</span></div><nav id="nav"></nav></aside><main class="right"><div class="detail-head"><div><h2>课堂知识速查</h2><p>核心定义 · 必要公式 · 简洁解释</p></div><button id="refresh" class="refresh">刷新</button></div><div class="filter" id="filters"></div><div id="content"></div><div class="foot" id="status">正在读取笔记…</div></main></div><script>
(()=>{'use strict';const $=x=>document.getElementById(x);let notes=[];let selected='全部';const keys=['基础概念','流体黏性','流体静力学','流体运动的描述','欧拉法基本概念','连续性方程'];const subs={'基础概念':'研究方法 · 流体受力 · 物理性质','流体黏性':'黏度 · 内摩擦','流体静力学':'压强 · 真空度','流体运动的描述':'欧拉法 · 加速度','欧拉法基本概念':'恒定流 · 流线 · 迹线','连续性方程':'质量守恒 · 基本公式'};function el(t,cls,s){const a=document.createElement(t);if(cls)a.className=cls;if(s!==undefined)a.textContent=s;return a}function fmt(s){const d=new Date(s+'T12:00:00');const weeks=['周日','周一','周二','周三','周四','周五','周六'];return (d.getMonth()+1)+'月'+d.getDate()+'日 '+weeks[d.getDay()]}function render(){let q=$('search').value.trim().toLowerCase();let full=notes.filter(n=>(n.title+' '+n.chapter+' '+n.content+' '+(n.keywords||'')).toLowerCase().includes(q));let filtered=full.filter(n=>selected==='全部'||n.chapter===selected);$('header-count').textContent=notes.length+' 条课堂知识';const nav=$('nav');nav.replaceChildren();let activeIndex=0;for(const name of keys){const matches=full.filter(n=>n.chapter===name);if(!matches.length)continue;const group=el('div','chapter'+((selected===name||q)?' open':''));const btn=el('button','chap-top');btn.type='button';btn.append(el('span','no',String(++activeIndex).padStart(2,'0')));btn.append(el('span','count',matches.length+' 条'));group.append(btn);btn.append(el('div','chap-name',name),el('div','chap-sub',subs[name]||''));const links=el('div','chap-links');for(const n of matches){const a=el('a',null,n.title);a.href='#'+n.id;a.onclick=()=>{if(selected!=='全部'&&selected!==n.chapter){selected=n.chapter;render()}};links.append(a)}btn.onclick=()=>group.classList.toggle('open');group.append(links);nav.append(group)}const filters=$('filters');filters.replaceChildren();for(const name of ['全部',...keys]){if(name!=='全部'&&!full.some(n=>n.chapter===name))continue;const pill=el('button','pill'+(selected===name?' active':''),name);pill.onclick=()=>{selected=name;render()};filters.append(pill)}let list=$('content');list.replaceChildren();let num=0;for(const name of keys){const section=filtered.filter(n=>n.chapter===name);if(!section.length)continue;list.append(el('div','section-title',name+' · '+section.length+' 条'));for(const n of section){const box=el('article','note');box.id=n.id;box.append(el('div','eyebrow','KNOWLEDGE  '+String(++num).padStart(2,'0')),el('h3',null,n.title),el('div','answer',n.content),el('div','date','新增 '+fmt(n.createdAt)+(n.updatedAt!==n.createdAt?' · 更新 '+fmt(n.updatedAt):'')));list.append(box)}}if(!filtered.length)list.append(el('div','empty','没有匹配的知识点。'))}async function load(){const button=$('refresh');button.disabled=true;$('status').textContent='检查更新中…';try{const r=await fetch('./notes.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.notes))throw Error('笔记格式错误');notes=d.notes.filter(n=>typeof n.chapter==='string'&&typeof n.title==='string'&&typeof n.content==='string'&&typeof n.createdAt==='string');render();$('status').textContent='已同步 '+notes.length+' 条知识点 · '+new Date().toLocaleTimeString('zh-CN')}catch(e){$('status').textContent='同步失败：'+e.message}finally{button.disabled=false}}$('search').oninput=()=>{selected='全部';render()};$('refresh').onclick=load;load()})();
</script></body></html>
