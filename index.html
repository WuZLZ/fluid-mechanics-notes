<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>流体力学课堂笔记</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#202c3d;background:#f4f6fa}*{box-sizing:border-box}body{margin:0;line-height:1.7}header{background:#224776;color:white;padding:18px 22px}h1{margin:0;font-size:23px}header p{margin:3px 0 0;font-size:13px;opacity:.85}main{max-width:1060px;margin:16px auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;padding:0 14px}aside,.item,.top{background:white;border:1px solid #dbe2eb;border-radius:11px;padding:14px}aside{position:sticky;top:12px;align-self:start;max-height:85vh;overflow:auto}input{width:100%;font-size:14px;padding:9px;border:1px solid #c5d0e0;border-radius:7px;margin:10px 0}nav a{display:block;text-decoration:none;color:#24528b;padding:5px 4px}nav .chapter{margin-top:12px;font-weight:700;font-size:13px;color:#6c7b90}.top{font-size:13px;color:#64748b;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}button{border:1px solid #bdcde4;background:#fff;padding:7px 10px;border-radius:7px;color:#24528b}.item{margin-bottom:12px;scroll-margin-top:12px}.item h2{font-size:18px;margin:0}.date{font-size:12px;color:#788497;margin:3px 0 9px}.body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}@media(max-width:650px){main{display:block;padding:0 9px;margin:9px auto}aside{position:static;max-height:230px;margin-bottom:10px}nav{max-height:125px;overflow:auto}.item h2{font-size:16px}}@media print{main{display:block}aside,.top{display:none}.item{break-inside:avoid}}
</style></head><body><header><h1>📘 流体力学课堂笔记</h1><p>教材式简洁笔记 · 自动目录 · 知识点日期</p></header><main><aside><b>目录 <span id="count"></span></b><input id="q" placeholder="搜索知识点"><nav id="toc"></nav></aside><section><div class="top"><span id="status">读取中…</span><button id="reload">检查更新</button></div><div id="list"></div></section></main>
<script>
(()=>{"use strict";let notes=[];const $=id=>document.getElementById(id);const weekdays=["周日","周一","周二","周三","周四","周五","周六"];function date(s){let d=new Date(s+"T12:00:00");return Number.isNaN(d.getTime())?s:(d.getMonth()+1)+"月"+d.getDate()+"日 "+weekdays[d.getDay()]}function el(t,cls,txt){const n=document.createElement(t);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function draw(){const query=$("q").value.trim().toLowerCase(),shown=notes.filter(n=>(n.chapter+" "+n.title+" "+n.content).toLowerCase().includes(query));$("count").textContent="("+shown.length+")";$("toc").replaceChildren();$("list").replaceChildren();let last="";for(const n of shown){if(last!==n.chapter){last=n.chapter;$("toc").append(el("div","chapter",last))}const link=el("a",null,n.title);link.href="#"+n.id;$("toc").append(link);const item=el("article","item");item.id=n.id;item.append(el("h2",null,n.title),el("div","date",n.chapter+" · 新增 "+date(n.createdAt)+(n.updatedAt!==n.createdAt?" · 修改 "+date(n.updatedAt):"")),el("div","body",n.content));$("list").append(item)}if(!shown.length)$("list").append(el("p",null,"暂无相关笔记。"))}async function load(){const btn=$("reload");btn.disabled=true;$("status").textContent="同步中…";try{let response=await fetch("./notes.json?v="+Date.now(),{cache:"no-store"});if(!response.ok)throw Error("HTTP "+response.status);let data=await response.json();if(!Array.isArray(data.notes)||!data.notes.every(n=>typeof n.id==="string"&&typeof n.title==="string"&&typeof n.chapter==="string"&&typeof n.content==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(n.createdAt)&&/^\d{4}-\d{2}-\d{2}$/.test(n.updatedAt)))throw Error("数据格式不正确");notes=data.notes;draw();$("status").textContent="已同步 "+notes.length+" 条 · "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}catch(e){$("status").textContent="读取失败："+e.message}finally{btn.disabled=false}}$("q").addEventListener("input",draw);$("reload").addEventListener("click",load);load()})();
</script></body></html>
